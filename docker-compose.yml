services:
  postgres:
    image: postgres:16-alpine
    container_name: n0-platform-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noauth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noauth}
      POSTGRES_DB: ${POSTGRES_DB:-n0_platform}
    volumes:
      - n0_platform_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noauth} -d ${POSTGRES_DB:-n0_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: n0-platform-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  api-gateway:
    build: ./services/api-gateway
    container_name: n0-api-gateway
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./services/api-gateway/.env.example
    environment:
      AUTH_SERVICE_URL: http://host.docker.internal:4000
      PROJECT_SERVICE_URL: http://host.docker.internal:4001
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n0_platform_pg_data:
